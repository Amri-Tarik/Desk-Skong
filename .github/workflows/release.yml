# Push a tag like v0.3.0 to build the portable zip and attach it to a *draft* GitHub
# Release. Check the notes and the zip by hand, then publish the draft.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: package and draft a release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (pinned in rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build and package
        id: package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: The tag matches the Cargo version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.package.outputs.version }}'
          if ($tag -ne "v$version") { throw "tag $tag does not match the Cargo version $version (expected v$version)" }

      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hand-written notes (docs/release-notes.md), not a list of every merged PR.
          $notes = Get-Content -Raw -Encoding UTF8 docs/release-notes.md
          gh release create '${{ github.ref_name }}' '${{ steps.package.outputs.zip }}' `
            --draft --notes "$notes" `
            --title "Desk-Skong ${{ steps.package.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
