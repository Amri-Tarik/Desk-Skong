[workspace]
resolver = "3"
members = ["crates/skong-core", "crates/skong-win", "crates/skong-ipc", "crates/skong", "crates/skong-panel", "crates/skong-extract"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
