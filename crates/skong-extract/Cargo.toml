[package]
name = "skong-extract"
version.workspace = true
edition.workspace = true
description = "Reads Hollow Knight's own sprite atlases from a local install (first-run art setup)"

[dependencies]
anyhow = "1.0.104"
log = "0.4.35"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skong-core = { path = "../skong-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Registry"] }
