[package]
name = "skong-ipc"
version.workspace = true
edition.workspace = true
description = "Desk-Skong pet <-> control panel protocol and named-pipe transport"

[dependencies]
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
